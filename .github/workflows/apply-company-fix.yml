name: Apply vehicle company field fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-company-fix.yml"

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          c = p.read_text(encoding="utf-8")

          css = "small{color:var(--muted);font-weight:500;line-height:1.4}"
          if ".hidden{display:none!important}" not in c:
              c = c.replace(css, css + "\n.hidden{display:none!important}", 1)

          old = 'function syncCompanyField(){ const isOther=vehicleCompanyEl.value==="Other"; otherCompanyWrap.classList.toggle("hidden",!isOther); otherVehicleCompanyEl.required=isOther; if(!isOther) otherVehicleCompanyEl.value=""; }'
          new = '''function syncCompanyField(){
  const isFour=vehicleTypeEl.value==="4-Wheeler";
  const isOther=vehicleCompanyEl.value==="Other";

  vehicleCompanyEl.disabled=!isFour;
  vehicleCompanyEl.required=isFour;

  if(!isFour){
    vehicleCompanyEl.value="";
    otherCompanyWrap.classList.add("hidden");
    otherVehicleCompanyEl.required=false;
    otherVehicleCompanyEl.value="";
    return;
  }

  otherCompanyWrap.classList.toggle("hidden",!isOther);
  otherVehicleCompanyEl.required=isOther;
  if(!isOther) otherVehicleCompanyEl.value="";
}'''
          if old not in c:
              raise SystemExit("Expected company-field function was not found")
          c = c.replace(old, new, 1)

          old_listener = 'vehicleCompanyEl.addEventListener("change", syncCompanyField);\nvehicleTypeEl.addEventListener("change", syncAccessDevice);\nsyncCompanyField(); syncAccessDevice();'
          new_listener = 'vehicleCompanyEl.addEventListener("change", syncCompanyField);\nvehicleTypeEl.addEventListener("change", () => { syncAccessDevice(); syncCompanyField(); });\nsyncCompanyField(); syncAccessDevice();'
          if old_listener not in c:
              raise SystemExit("Expected company/type listeners were not found")
          c = c.replace(old_listener, new_listener, 1)

          p.write_text(c, encoding="utf-8")

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix vehicle company field visibility and 2W 3W disablement" || exit 0
          git push

      - name: Disable this one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable apply-company-fix.yml --repo "${{ github.repository }}" || true
